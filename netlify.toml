"$schema" = "https://open-api.netlify.com/netlify.schema.json"

# The unit tests run first, so a failing test stops the deploy and the
# previous one stays live.
[build]
command = "pnpm test && pnpm run build"
publish = "dist"

[[headers]]
for = "/assets/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# Every response, including the files under /assets/. Cache-Control stays
# in the rule above, so the two rules never set the same header.
[[headers]]
for = "/*"

[headers.values]
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"

# Netlify serves the files in dist, and the app draws every page from
# index.html. Each page in src/routes/routes.ts needs a rule here so it
# loads with a 200 status (/ is index.html itself, so it needs none).
# src/tests/notFound.test.mts checks that the two lists match.
[[redirects]]
from = "/es"
to = "/index.html"
status = 200

# Any other address still loads the app, which shows its not-found page,
# but with a 404 status so search engines drop it. Keep this rule last:
# Netlify uses the first rule that matches.
[[redirects]]
from = "/*"
to = "/index.html"
status = 404
